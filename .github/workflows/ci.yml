name: ChromeRemote CI

on:
  push:
    branches:
      - main
      - "security/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Build extension test artifact
        run: npm run build:extension

      - name: Run tests
        run: npm test

      - name: Build relay and phone remote
        run: npm run build:railway

      - name: Build production extension
        run: npm run build:extension:production
