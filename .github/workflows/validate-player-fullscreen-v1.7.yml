name: Validate Player Fullscreen v1.7

on:
  push:
    branches:
      - feature/player-fullscreen
    paths:
      - ".github/workflows/validate-player-fullscreen-v1.7.yml"
      - "src/**"
      - "remote/**"
      - "scripts/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/player-fullscreen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync package version
        run: npm version 1.7.0 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Type and lint checks
        run: npm run lint

      - name: Build production extension
        run: npm run build:extension:production

      - name: Run tests
        run: npm test

      - name: Build Railway app
        run: npm run build:railway

      - name: Verify phone fullscreen routing
        run: |
          grep -q 'ENTER_PLAYER_FULLSCREEN' remote/src/socket.ts
          grep -q 'EXIT_PLAYER_FULLSCREEN' remote/src/socket.ts
          grep -q 'enterYouTubePlayerFullscreen' src/content/content.ts
          grep -q 'enterNetflixPlayerFullscreen' src/content/content.ts

      - name: Commit synced package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync package metadata for v1.7.0"
          git push origin HEAD:feature/player-fullscreen
