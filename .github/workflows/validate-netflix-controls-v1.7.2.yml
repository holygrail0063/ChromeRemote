name: Validate Netflix Controls v1.7.2

on:
  push:
    branches:
      - fix/netflix-controls-v172
    paths:
      - ".github/workflows/validate-netflix-controls-v1.7.2.yml"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/netflix-controls-v172

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync package version
        run: npm version 1.7.2 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Type and lint checks
        run: npm run lint

      - name: Build production extension
        run: npm run build:extension:production

      - name: Run tests
        run: npm test

      - name: Verify Netflix control integration
        run: |
          grep -q 'playNextEpisode' src/netflix/main-world-adapter.ts
          grep -q 'resolveSession(videoPlayer, "playNextEpisode")' src/netflix/main-world-adapter.ts
          grep -q 'document.querySelector<HTMLVideoElement>("video")' src/content/player-fullscreen.ts
          grep -q 'video.${PLAYER_FULLSCREEN_CLASS}' src/content/player-fullscreen.ts

      - name: Commit synced package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync package metadata for v1.7.2"
          git push origin HEAD:fix/netflix-controls-v172
