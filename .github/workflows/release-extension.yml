name: Build ChromeRemote Extension Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "remote/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".env.production"
      - ".github/workflows/release-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production extension
        run: npm run build:extension:production

      - name: Add installation instructions
        run: |
          cat > dist/INSTALL.txt <<'EOF'
          ChromeRemote v1.9.0 - Installation & Use
          =========================================

          INSTALL ON YOUR COMPUTER
          1. Extract ChromeRemote-Extension.zip to a permanent folder.
          2. Open Google Chrome.
          3. Go to: chrome://extensions
          4. Turn ON Developer mode (top-right).
          5. Click "Load unpacked".
          6. Select the extracted ChromeRemote folder.
          7. Optional: pin ChromeRemote from Chrome's Extensions menu.

          PAIR YOUR PHONE ONCE
          1. Click the ChromeRemote extension icon from Chrome.
          2. Click "Pair Phone".
          3. A unique QR code will appear.
          4. Scan the QR with your phone camera, or open:
             https://chromeremote-production.up.railway.app/remote_session
             and use the ChromeRemote scanner.
          5. The phone is paired to ChromeRemote itself, not one Netflix or YouTube tab.
          6. Switch between Netflix and YouTube tabs in Chrome. The phone remote follows whichever supported tab is active.

          CHROME-WIDE SESSION
          - One QR pairs the phone to the ChromeRemote extension session.
          - Commands are routed to the currently active Netflix or YouTube tab.
          - Switching between Netflix and YouTube does not require another QR.
          - The phone now requests fresh player state every 500 ms while connected, so transient tab/player loading states recover without manually refreshing the phone page.
          - If an unsupported tab is active, playback controls wait until Chrome is switched back to Netflix or YouTube.

          PHONE CONTROLS
          - Play / Pause
          - Rewind 10 seconds / Forward 10 seconds
          - Seek slider
          - Next Episode on Netflix / Next Video on YouTube
          - YouTube search bar (hidden on Netflix)
          - Browse YouTube search results with Previous / Next / Open Video
          - Player Fullscreen / Exit Fullscreen
          - Mute / Unmute
          - Volume controls
          - Playback speeds: 0.5x, 0.75x, 1x, 1.25x, 1.5x

          NETFLIX NEXT EPISODE
          - ChromeRemote first uses Netflix's own active player-session playNextEpisode action when available.
          - It falls back to Netflix's real rendered Next Episode control.
          - ChromeRemote no longer seeks the current episode to the end to reveal the button. This avoids the black post-play frame regression seen in v1.8.0.
          - Netflix's M7375-safe normal seek implementation remains unchanged.

          FULLSCREEN
          - Phone fullscreen is player-only viewport mode, not Chrome's F11-style browser-window fullscreen.
          - ChromeRemote does not call YouTube or Netflix native fullscreen from the phone because Chrome requires a trusted local click.
          - v1.9.0 expands the site's own player shell instead of moving or fixing the raw video element.
          - No separate black overlay is placed over the video.
          - Exit Fullscreen restores the normal page layout.
          - The Chrome tab/address bar can remain visible because true browser fullscreen requires a trusted click or F11.

          YOUTUBE AUDIO
          - Mute / Unmute uses YouTube's own player API instead of only changing the raw video element.
          - YouTube's native mute button is used as a fallback if the player API is unavailable.
          - Volume state is read from YouTube's player API when available.

          YOUTUBE SEARCH AND BROWSING
          - The search bar appears only when the active Chrome tab is YouTube.
          - Searching from the phone opens YouTube's search-results page in the active desktop YouTube tab.
          - The phone remains paired while browsing YouTube search results.
          - Use Previous and Next on the phone to move a visible highlight through desktop YouTube results.
          - ChromeRemote automatically scrolls the selected result into view and loads farther results as you continue downward.
          - Tap Open Video to open the highlighted result without touching the mouse.
          - Playback controls become available again when the selected YouTube video opens.

          NOTES
          - Keep the extracted extension folder on your computer after installation.
          - ChromeRemote currently uses Chrome's Developer mode / Load unpacked flow.
          - No Node.js, npm, Git, or Railway account is required for normal use.
          - The hosted ChromeRemote relay/mobile service is used automatically.

          Project:
          https://github.com/holygrail0063/ChromeRemote
          EOF

      - name: Create unpacked extension ZIP
        run: |
          rm -f ChromeRemote-Extension.zip
          cd dist
          zip -r ../ChromeRemote-Extension.zip .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./public/manifest.json').version")
          TAG="v${VERSION}"
          TITLE="ChromeRemote v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ChromeRemote-Extension.zip --clobber
          else
            gh release create "$TAG" ChromeRemote-Extension.zip \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "ChromeRemote v1.9.0 is a reliability release. Fullscreen now expands the site-owned player shell instead of the raw video element or a black overlay. Netflix Next Episode no longer seeks to the end and instead uses Netflix's player-session next-episode action with rendered-control fallback. The phone remote keeps a 500 ms active-state watchdog so Netflix/YouTube tab switching recovers without manual phone refreshes. Chrome-wide pairing, Netflix M7375-safe seeking, YouTube search/browsing, and YouTube audio controls are preserved."
          fi
