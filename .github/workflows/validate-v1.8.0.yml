name: Validate ChromeRemote v1.8.0

on:
  push:
    branches:
      - release/v1.8.0-global-session
    paths:
      - ".github/workflows/validate-v1.8.0.yml"
      - "src/**"
      - "remote/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.8.0-global-session

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync package version
        run: npm version 1.8.0 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Type and lint checks
        run: npm run lint

      - name: Build production extension
        run: npm run build:extension:production

      - name: Run tests
        run: npm test

      - name: Verify Chrome-wide session routing
        run: |
          grep -q 'lastFocusedWindow: true' src/background/background.ts
          grep -q 'sendCommandToActiveTab' src/background/background.ts
          grep -q 'chrome.tabs.onActivated' src/background/background.ts
          grep -q 'startPolling();' src/background/background.ts
          ! grep -q 'storedPairing.pairedTabId' src/background/background.ts
          grep -q 'REMOTE_CONNECT_PHONE" }' src/popup/Popup.tsx

      - name: Verify remote-safe fullscreen
        run: |
          grep -q 'video.${PLAYER_FULLSCREEN_CLASS}' src/content/player-fullscreen.ts
          grep -q 'PLAYER_FULLSCREEN_OVERLAY_ID' src/content/player-fullscreen.ts
          grep -q 'getLargestVisibleVideo' src/content/player-fullscreen.ts
          grep -q 'enterVideoViewportFullscreen(video)' src/content/player-fullscreen.ts
          ! grep -q 'requestFullscreen' src/content/player-fullscreen.ts
          ! grep -q 'control.click' src/content/player-fullscreen.ts

      - name: Verify Netflix seek safety
        run: node scripts/verify-extension-build.mjs

      - name: Commit synced package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync package metadata for v1.8.0"
          git push origin HEAD:release/v1.8.0-global-session
