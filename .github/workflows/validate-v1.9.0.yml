name: Validate ChromeRemote v1.9.0

on:
  push:
    branches:
      - release/v1.9.0-reliability
    paths:
      - ".github/workflows/validate-v1.9.0.yml"
      - "src/**"
      - "remote/**"
      - "server/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.9.0-reliability

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync package version
        run: npm version 1.9.0 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Type and lint checks
        run: npm run lint

      - name: Build production extension
        run: npm run build:extension:production

      - name: Build Railway phone and relay app
        run: npm run build:railway

      - name: Run full automated tests
        run: npm test

      - name: Verify fullscreen black-screen regression is removed
        run: |
          grep -q 'getYouTubePlayerRoot' src/content/player-fullscreen.ts
          grep -q 'getNetflixPlayerRoot' src/content/player-fullscreen.ts
          grep -q 'enterViewportFullscreen(root)' src/content/player-fullscreen.ts
          ! grep -q 'PLAYER_FULLSCREEN_OVERLAY_ID' src/content/player-fullscreen.ts
          ! grep -q 'video.${PLAYER_FULLSCREEN_CLASS}' src/content/player-fullscreen.ts
          ! grep -q 'requestFullscreen(' src/content/player-fullscreen.ts

      - name: Verify Netflix Next Episode is non-destructive
        run: |
          grep -q 'playNextEpisode' src/netflix/next-episode.ts
          grep -q 'tryRenderedNextEpisode' src/netflix/next-episode.ts
          ! grep -q '\.seek(' src/netflix/next-episode.ts
          ! grep -q 'getDuration' src/netflix/next-episode.ts

      - name: Verify phone state sync remains active
        run: |
          grep -q 'stateSyncIntervalMs = 500' remote/src/socket.ts
          grep -q 'requestStateNow' remote/src/socket.ts
          grep -q 'lastState' remote/src/socket.ts
          ! grep -q 'hasPlayerState' remote/src/socket.ts

      - name: Verify Chrome-wide active-tab routing remains intact
        run: |
          grep -q 'lastFocusedWindow: true' src/background/background.ts
          grep -q 'sendCommandToActiveTab' src/background/background.ts
          grep -q 'chrome.tabs.onActivated' src/background/background.ts
          ! grep -q 'storedPairing.pairedTabId' src/background/background.ts

      - name: Verify Netflix M7375 seek safety
        run: node scripts/verify-extension-build.mjs

      - name: Commit synced package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync package metadata for v1.9.0"
          git push origin HEAD:release/v1.9.0-reliability
